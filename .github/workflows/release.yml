name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows-package:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      # Artifacts take their version from the tag while AppConstants.APP_VERSION is compiled in,
      # and nothing kept the two together. The constant sat at 1.3.0 through the whole 1.4.0
      # cycle, which would have shipped an app comparing its own version against the release it
      # came from and telling every new user an update was waiting.
      #
      # Checked before anything is built, so a mismatch costs seconds rather than a published
      # release that has to be withdrawn.
      - name: Verify APP_VERSION matches the tag
        shell: pwsh
        run: |
          $expected = "${{ steps.version.outputs.version }}"
          $constants = "core/src/main/kotlin/com/github/ahatem/qtranslate/core/shared/AppConstants.kt"
          $match = Select-String -Path $constants -Pattern 'const val APP_VERSION = "([^"]+)"'
          if (-not $match) {
            Write-Error "Could not find APP_VERSION in $constants"
            exit 1
          }
          $actual = $match.Matches[0].Groups[1].Value

          # A prerelease may carry either form. Tagging v1.4.0-rc.1 with APP_VERSION at 1.4.0 is
          # not the mistake this check exists to catch, and demanding an exact match would mean
          # editing the constant for every candidate and again for the final tag — churn that
          # invites the very drift being guarded against. A stale 1.3.0 still fails either way.
          $expectedBase = ($expected -split '-')[0]
          if ($actual -ne $expected -and $actual -ne $expectedBase) {
            Write-Error @"
          APP_VERSION does not match the release tag.
            tag:          $expected
            APP_VERSION:  $actual
          Update $constants and push a new tag. The compiled-in version is what the
          in-app updater compares against, so a mismatch tells every new install that an
          update is already available.
          "@
            exit 1
          }
          Write-Host "APP_VERSION $actual matches tag $expected."

      - name: Build portable Windows app image
        shell: pwsh
        run: ./scripts/build-windows-release.ps1 -Version "${{ steps.version.outputs.version }}" -JavaHome $env:JAVA_HOME
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: camwork-translate-windows-x64
          path: |
            build/release/CamWork-Translate-${{ steps.version.outputs.version }}-Setup-windows-x64.exe
            build/release/CamWork-Translate-${{ steps.version.outputs.version }}-Setup-windows-x64.exe.sha256
            build/release/CamWork-Translate-${{ steps.version.outputs.version }}-windows-x64.zip
            build/release/CamWork-Translate-${{ steps.version.outputs.version }}-windows-x64.zip.sha256
          if-no-files-found: error

  macos-package:
    name: Build macOS ${{ matrix.arch }} package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            java_architecture: aarch64
          - arch: x64
            runner: macos-15-intel
            java_architecture: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # jpackage must run under JDK 17, so 17 is installed last: setup-java points
      # JAVA_HOME at whichever version it installed most recently. Kotlin compiles
      # against a 21 toolchain, which the foojay resolver in settings.gradle.kts
      # supplies on its own.
      - name: Set up Java toolchains
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          architecture: ${{ matrix.java_architecture }}
          java-version: |
            21
            17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check for macOS signing secret
        id: has-signing
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [[ -n "$SIGNING_IDENTITY" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID and notarization credentials
        id: mac-signing
        if: steps.has-signing.outputs.present == 'true'
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          for variable in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD SIGNING_IDENTITY \
            NOTARY_APPLE_ID NOTARY_TEAM_ID NOTARY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "Отсутствует обязательный секрет macOS: $variable" >&2
              exit 1
            fi
          done

          certificate="$RUNNER_TEMP/camwork-developer-id.p12"
          keychain="$RUNNER_TEMP/camwork-signing.keychain-db"
          keychain_password="$(uuidgen)$(uuidgen)"
          notary_profile="camwork-notary-${{ matrix.arch }}"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

          xcrun notarytool store-credentials "$notary_profile" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --keychain "$keychain"

          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "notary-profile=$notary_profile" >> "$GITHUB_OUTPUT"
          echo "signing-identity=$SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build native app and DMG
        shell: bash
        run: |
          BUILD_ARGUMENTS=(
            --version "${{ steps.version.outputs.version }}"
            --arch "${{ matrix.arch }}"
            --format dmg
            --java-home "$JAVA_HOME"
          )
          SIGNING_IDENTITY="${{ steps.mac-signing.outputs.signing-identity }}"
          if [[ -n "$SIGNING_IDENTITY" ]]; then
            BUILD_ARGUMENTS+=(
              --signing-identity "$SIGNING_IDENTITY"
              --signing-keychain "${{ steps.mac-signing.outputs.keychain }}"
              --notary-profile "${{ steps.mac-signing.outputs.notary-profile }}"
              --notarize
            )
          else
            echo "::warning::Секреты Apple Developer ID не заданы — собирается неподписанный ad-hoc DMG (только для личного использования/QA, без нотаризации)."
          fi
          bash ./scripts/build-macos-release.sh "${BUILD_ARGUMENTS[@]}"
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: camwork-translate-macos-${{ matrix.arch }}
          path: |
            build/release/CamWork-Translate-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.app.zip
            build/release/CamWork-Translate-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.app.zip.sha256
            build/release/CamWork-Translate-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.dmg
            build/release/CamWork-Translate-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          keychain="${{ steps.mac-signing.outputs.keychain }}"
          if [[ -n "$keychain" && -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          rm -f -- "$RUNNER_TEMP/camwork-developer-id.p12"

  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    needs: [windows-package, macos-package]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release variants
        run: ./gradlew assembleReleaseVariants "-PreleaseVersion=${{ steps.version.outputs.version }}" --no-daemon
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: camwork-translate-windows-x64
          path: build/release

      - name: Download macOS packages
        uses: actions/download-artifact@v8
        with:
          pattern: camwork-translate-macos-*
          path: build/release
          merge-multiple: true

      - name: Add native package checksums
        run: |
          cd build/release
          sha256sum "CamWork-Translate-${{ steps.version.outputs.version }}-Setup-windows-x64.exe" >> SHA256SUMS.txt
          sha256sum "CamWork-Translate-${{ steps.version.outputs.version }}-windows-x64.zip" >> SHA256SUMS.txt
          sha256sum "CamWork-Translate-${{ steps.version.outputs.version }}-macos-arm64.app.zip" >> SHA256SUMS.txt
          sha256sum "CamWork-Translate-${{ steps.version.outputs.version }}-macos-arm64.dmg" >> SHA256SUMS.txt
          sha256sum "CamWork-Translate-${{ steps.version.outputs.version }}-macos-x64.app.zip" >> SHA256SUMS.txt
          sha256sum "CamWork-Translate-${{ steps.version.outputs.version }}-macos-x64.dmg" >> SHA256SUMS.txt

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="$PREV_TAG..HEAD"
          fi

          # Categorize commits by Conventional Commit type
          FEATURES=$(git log --pretty=format:"%s" $RANGE | grep -E "^feat(\(.+\))?:" | sed 's/^feat[^:]*: /- /' || true)
          FIXES=$(git log --pretty=format:"%s" $RANGE | grep -E "^fix(\(.+\))?:" | sed 's/^fix[^:]*: /- /' || true)
          REFACTORS=$(git log --pretty=format:"%s" $RANGE | grep -E "^refactor(\(.+\))?:" | sed 's/^refactor[^:]*: /- /' || true)
          DOCS=$(git log --pretty=format:"%s" $RANGE | grep -E "^docs(\(.+\))?:" | sed 's/^docs[^:]*: /- /' || true)
          CHORES=$(git log --pretty=format:"%s" $RANGE | grep -E "^(chore|ci|build)(\(.+\))?:" | sed 's/^[^:]*: /- /' || true)
          OTHER=$(git log --pretty=format:"%s" $RANGE | grep -vE "^(feat|fix|refactor|docs|chore|ci|build)(\(.+\))?:" | sed 's/^/- /' || true)

          # Build categorized log
          LOG=""
          [ -n "$FEATURES" ]  && LOG="${LOG}### New features\n${FEATURES}\n\n"
          [ -n "$FIXES" ]     && LOG="${LOG}### Bug fixes\n${FIXES}\n\n"
          [ -n "$REFACTORS" ] && LOG="${LOG}### Improvements\n${REFACTORS}\n\n"
          [ -n "$DOCS" ]      && LOG="${LOG}### Documentation\n${DOCS}\n\n"
          [ -n "$CHORES" ]    && LOG="${LOG}### Maintenance\n${CHORES}\n\n"
          [ -n "$OTHER" ]     && LOG="${LOG}### Other\n${OTHER}\n\n"

          # Fall back to flat log if no conventional commits found
          if [ -z "$LOG" ]; then
            LOG=$(git log --pretty=format:"- %s" $RANGE)
          fi

          echo "log<<EOF" >> "$GITHUB_OUTPUT"
          printf "%b" "$LOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: CamWork Translate ${{ steps.version.outputs.version }}
          body: |
            ## Что изменилось

            ${{ steps.changelog.outputs.log }}

            ---

            **Полная история:** https://github.com/${{ github.repository }}/blob/main/CHANGELOG_CAMWORK.md

            ## Загрузки

            | Файл | Для кого | Нужна Java |
            |---|---|---|
            | **[⬇ Установщик Windows x64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/CamWork-Translate-${{ steps.version.outputs.version }}-Setup-windows-x64.exe)** | **Основной вариант для моделей.** Запустить EXE; права администратора не нужны. | Нет, runtime включён |
            | **[⬇ Переносимый Windows x64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/CamWork-Translate-${{ steps.version.outputs.version }}-windows-x64.zip)** | Распаковать в доступную для записи папку и запустить `CamWork Translate.exe`. | Нет, runtime включён |
            | **[⬇ macOS Apple Silicon](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/CamWork-Translate-${{ steps.version.outputs.version }}-macos-arm64.dmg)** | Mac на M1/M2/M3/M4 и новее. | Нет, runtime включён |
            | **[⬇ macOS Intel](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/CamWork-Translate-${{ steps.version.outputs.version }}-macos-x64.dmg)** | Mac с процессором Intel. | Нет, runtime включён |
            | **[⬇ Переносимый ZIP](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/CamWork-Translate-${{ steps.version.outputs.version }}.zip)** | Windows, macOS или Linux с установленной Java. | Java 11+ |
            | **[⬇ Только приложение](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/CamWork-Translate-App-${{ steps.version.outputs.version }}.jar)** | Разработка и собственный комплект плагинов. | Java 11+ |

            Windows- и переносимый архивы уже содержат все штатные плагины.

            ## Проверка файла

            Загрузите [SHA256SUMS.txt](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS.txt)
            в тот же каталог и выполните:
            ```
            sha256sum -c SHA256SUMS.txt
            ```

          files: |
            build/release/CamWork-Translate-App-${{ steps.version.outputs.version }}.jar
            build/release/CamWork-Translate-${{ steps.version.outputs.version }}.zip
            build/release/CamWork-Translate-${{ steps.version.outputs.version }}-Setup-windows-x64.exe
            build/release/CamWork-Translate-${{ steps.version.outputs.version }}-windows-x64.zip
            build/release/CamWork-Translate-${{ steps.version.outputs.version }}-macos-arm64.app.zip
            build/release/CamWork-Translate-${{ steps.version.outputs.version }}-macos-arm64.app.zip.sha256
            build/release/CamWork-Translate-${{ steps.version.outputs.version }}-macos-arm64.dmg
            build/release/CamWork-Translate-${{ steps.version.outputs.version }}-macos-arm64.dmg.sha256
            build/release/CamWork-Translate-${{ steps.version.outputs.version }}-macos-x64.app.zip
            build/release/CamWork-Translate-${{ steps.version.outputs.version }}-macos-x64.app.zip.sha256
            build/release/CamWork-Translate-${{ steps.version.outputs.version }}-macos-x64.dmg
            build/release/CamWork-Translate-${{ steps.version.outputs.version }}-macos-x64.dmg.sha256
            build/release/plugins/*.jar
            build/release/release-metadata.json
            build/release/SIZE_REPORT.md
            build/release/SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          draft: false
